<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Ta-Te-Ti</title>
    <link rel="stylesheet" href="Prueba.css">
</head>
<body>
    <h1>Ta-Te-Ti</h1>
    
    <!-- Botón de ajustes -->
    <button id="ajustesBoton">Ajustes</button>

    <!-- Menú de ajustes (oculto por defecto) -->
    <div id="menuAjustes" class="hidden">
        <h2>Ajustes</h2>
        <label for="toggleMusica">Activar/Desactivar Música:</label>
        <button id="toggleMusica">Activar/Desactivar</button>
        <br>
        <label for="volumen">Volumen:</label>
        <input type="range" id="volumen" min="0" max="1" step="0.1" value="0.5">
        <br>
        <button id="cerrarAjustes">Cerrar</button>
    </div>

    <!-- Tablero de Ta-Te-Ti -->
    <div id="tablero">
        <div class="celda" data-index="0"></div>
        <div class="celda" data-index="1"></div>
        <div class="celda" data-index="2"></div>
        <div class="celda" data-index="3"></div>
        <div class="celda" data-index="4"></div>
        <div class="celda" data-index="5"></div>
        <div class="celda" data-index="6"></div>
        <div class="celda" data-index="7"></div>
        <div class="celda" data-index="8"></div>
    </div>

    <!-- Contador de resultados -->
    <div id="contador" class="hidden"></div>

    <!-- Botón para reiniciar el juego -->
    <button id="reiniciar">Reiniciar Juego</button>

    <!-- Música de fondo -->
    <audio id="musica" loop>
        <source src="musica_fondo.mp3" type="audio/mpeg">
        Tu navegador no soporta la etiqueta de audio.
    </audio>

    <script src="Prueba.js"></script>
</body>
</html>
